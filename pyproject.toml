[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medicare-rebuild"
description = "Python-based solution designed to rebuild the data architecture for a healthcare provider's remote patient monitoring program billed to Medicare."
authors = [{ name = "Craig Hurley", email = "chingdorp@pm.me" }]
version = "3.3.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "Pandas >=3.0.0, <4.0.0",
    "NumPy >=2.0.0, <3.0.0",
    "SQLAlchemy >=2.0.23, <3.0.0",
    "pyodbc >=5.1.0, <6.0.0",
    "colorlog >=6.8.0, <7.0.0",
    "python-dotenv >=1.0.1, <2.0.0",
    "requests >=2.31.0, <3.0.0",
    "openpyxl >=3.1.2, <4.0.0",
    "certifi >=2024.7.4",
    "urllib3 >=2.0, <3.0.0",
    "alembic >=1.20.0, <2.0.0",
]

[project.urls]
Repository = "https://github.com/chingdrop/medicare-rebuild"

[project.scripts]
medicare-rebuild = "medicare_rebuild.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medicare_rebuild"]

# Hatchling's sdist takes every file the repo's .gitignore doesn't exclude (and ignores a
# personal global gitignore). These are excluded explicitly as well, so the sdist can't
# pick up local data, logs, secrets or editor settings even if .gitignore changes. The
# file types match the no-data-files pre-commit hook. .env.example is still shipped.
[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    "data",
    "demo_data",
    "demo_output",
    "logs",
    ".env",
    ".env.local",
    "*.csv",
    "*.xlsx",
    "*.xls",
    "*.bak",
    "*.bacpac",
    "*.mdf",
    "*.ldf",
    "*.parquet",
    "*.db",
    "*.sqlite",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest >=9.0.3, <10.0.0",
    "requests-mock>=1.12.1",
    "ruff>=0.15.21",
    "pandas-stubs~=3.0.5",
    "pre-commit>=4.6.0",
    "faker>=40.39.0",
    "pytest-cov>=7.1.0",
    "time-machine>=3.5.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: exercises a real database container; skipped by default, run with -m integration",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes. I: import order. B: bugbear. UP: pyupgrade.
# SIM: flake8-simplify. S: flake8-bandit security checks.
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest tests use plain assert
    "S105",  # fixtures hold fake tokens and mocked endpoint URLs
    "S106",  # fake client secret passed to the API client under test
    "E501",  # long fixture rows, expected strings and test names read better unwrapped
]
"tools/**" = [
    "S101",  # assert used for internal invariants in demo tooling
    "S311",  # seeded `random` for reproducible synthetic data; not security-sensitive
]
"tools/audit_sheet.py" = [
    "S603",  # runs Chrome and ffmpeg with argument lists (no shell), picked by the person running it
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
# Passes today with the flags above. Stricter settings would flag (measured 2026-10-03):
#   --strict                 56 errors in 7 files: 21 type-arg, 17 no-untyped-def,
#                            10 no-untyped-call, 8 no-any-return
#   --disallow-untyped-defs  17 errors in 5 files
#   --warn-return-any        8 errors in 3 files
# tools/ and tests/ are not type-checked (`mypy src tools` reports 34 errors in tools/).

[tool.coverage.run]
source = ["src/medicare_rebuild", "tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# Floor = measured baseline minus 2, rounded down (74.71% with branch coverage on
# 2026-10-03). Raise it in the same PR when the baseline exceeds floor + 4.
fail_under = 72
