[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medicare-rebuild"
description = "Python-based solution designed to rebuild the data architecture for a healthcare provider's remote patient monitoring program billed to Medicare."
authors = [{ name = "Craig Hurley", email = "chingdorp@pm.me" }]
version = "3.3.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "Pandas >=2.0.3, <3.0.0",
    "NumPy >=1.24.3, <2.0.0",
    "SQLAlchemy >=2.0.23, <3.0.0",
    "pyodbc >=5.1.0, <6.0.0",
    "colorlog >=6.8.0, <7.0.0",
    "python-dotenv >=1.0.1, <2.0.0",
    "requests >=2.31.0, <3.0.0",
    "openpyxl >=3.1.2, <4.0.0",
    "certifi >=2024.7.4",
    "urllib3 >=2.0, <3.0.0",
    "alembic >=1.20.0, <2.0.0",
]

[project.urls]
Repository = "https://github.com/chingdrop/medicare-rebuild"

[project.scripts]
medicare-rebuild = "medicare_rebuild.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest >=9.0.3, <10.0.0",
    "requests-mock>=1.12.1",
    "ruff>=0.15.21",
    "pandas-stubs>=2.3.3,<3.1.0",
    "pre-commit>=4.6.0",
    "faker>=40.39.0",
    "pytest-cov>=7.1.0",
    "time-machine>=3.5.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: exercises a real database container; skipped by default, run with -m integration",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes. I: import order. B: bugbear. UP: pyupgrade.
# S: flake8-bandit security checks.
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    # Line length is left to `ruff format`, which does not wrap docstrings, comments,
    # SQL or other string literals. 80 such lines exist and are not worth rewrapping.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest tests use plain assert
    "S105",  # fixtures hold fake tokens and mocked endpoint URLs
    "S106",  # fake client secret passed to the API client under test
]
"tools/**" = [
    "S101",  # assert used for internal invariants in demo tooling
    "S311",  # seeded `random` for reproducible synthetic data; not security-sensitive
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
# Lenient baseline: passes today. Stricter settings would flag (as of 2026-09):
#   --strict                 42 errors in src: 12 type-arg, 11 no-untyped-def,
#                            10 no-untyped-call, 7 no-any-return, 2 arg-type
#   --check-untyped-defs     2 errors (arg-type) in one file
#   --disallow-untyped-defs  11 errors in 4 files
#   --warn-return-any        7 errors in 2 files
# tools/ and tests/ are not type-checked (`mypy src tools` reports 8 errors in tools/).

[tool.coverage.run]
source = ["src/medicare_rebuild", "tools"]

[tool.coverage.report]
show_missing = true
skip_empty = true
